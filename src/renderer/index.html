<!doctype html>
<!-- 파일 도구 막대, 편집기 자리, 인쇄 미리보기로 이루어진 앱 화면 -->
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' blob:; frame-src 'self'; connect-src 'self'"
    />
    <title>다음오피스</title>
    <link rel="stylesheet" href="/renderer/style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="doc-title">
        <span id="doc-name">제목 없음</span>
        <span id="doc-state"></span>
      </div>
      <nav class="actions" aria-label="문서 작업">
        <div class="group" role="group" aria-label="파일">
          <button type="button" data-command="new" title="새 문서 (Ctrl+N)">새 문서</button>
          <button type="button" data-command="open" title="열기 (Ctrl+O)">열기</button>
          <button type="button" data-command="save" title="저장 (Ctrl+S)">저장</button>
          <button type="button" data-command="save-as" title="다른 이름으로 저장 (Ctrl+Shift+S)">다른 이름으로 저장</button>
        </div>
        <div class="group" role="group" aria-label="서식">
          <button type="button" data-command="font" title="선택한 글자의 글꼴과 크기 설정">글꼴 설정</button>
        </div>
        <div class="group" role="group" aria-label="출력">
          <button type="button" data-command="preview" title="인쇄 미리보기 (Ctrl+Shift+P)">미리보기</button>
          <button type="button" data-command="print" title="인쇄 (Ctrl+P)">인쇄</button>
        </div>
      </nav>
    </header>
    <main id="editor"></main>
    <section id="preview" aria-label="인쇄 미리보기" hidden>
      <div class="preview-bar">
        <h1 id="preview-title">인쇄 미리보기</h1>
        <div class="group">
          <button type="button" id="preview-print">인쇄</button>
          <button type="button" id="preview-close">닫기</button>
        </div>
      </div>
      <div id="preview-pages" tabindex="-1"></div>
    </section>
    <style id="print-page-style"></style>
    <script type="module" src="/renderer/app.js"></script>
  </body>
</html>
